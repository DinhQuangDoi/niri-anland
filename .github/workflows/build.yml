name: build

on:
  push:
    branches:
      - anland
    tags:
      - '*-anland.*'
  workflow_dispatch:

env:
  DEPS_APT: curl gcc clang pkg-config libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libpango1.0-dev libdisplay-info-dev

jobs:
  build:
    name: build niri (aarch64)
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Install dependencies
        run: |
          apt-get update -y
          apt-get install -y ${{ env.DEPS_APT }} git

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.87
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:${PATH}"
          rustc --version

      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:${PATH}"
          cargo build --release

      - name: Show binary
        run: |
          file target/release/niri
          ls -lh target/release/niri
          ldd target/release/niri

      - uses: actions/upload-artifact@v4
        with:
          name: niri-aarch64
          path: target/release/niri
          retention-days: 7
          if-no-files-found: error
