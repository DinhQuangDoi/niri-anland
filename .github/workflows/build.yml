name: build

on:
  push:
    branches:
      - anland
    tags:
      - '*-anland.*'
  workflow_dispatch:

env:
  DEPS_APT: curl gcc pkg-config libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libpango1.0-dev libdisplay-info-dev file

jobs:
  build:
    name: build niri (aarch64)
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Install dependencies
        run: |
          apt-get update -y
          apt-get install -y ${{ env.DEPS_APT }} git ccache

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.87
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:${PATH}"
          rustc --version

      # Custom ccache-based cache keyed on Cargo.lock + relevant crate sources.
      # The build.rs/cc builds (anland-sys C producer + smithay EGL FFI) benefit
      # most, and Cargo caches the Rust crates for the heavy parts.
      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ccache-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'anland-sys/src/**') }}
          restore-keys: |
            ccache-${{ runner.arch }}-

      - name: cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.arch }}-

      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:${PATH}"
          export CC="ccache gcc"
          export CXX="ccache g++"
          ccache --max-size=2G --set-config cache_dir=/root/.cache/ccache
          export CARGO_BUILD_JOBS=4
          cargo build --release
          ccache --show-stats

      - name: Show binary
        run: |
          file target/release/niri
          ls -lh target/release/niri
          ldd target/release/niri

      - uses: actions/upload-artifact@v4
        with:
          name: niri-aarch64
          path: target/release/niri
          retention-days: 7
          if-no-files-found: error
